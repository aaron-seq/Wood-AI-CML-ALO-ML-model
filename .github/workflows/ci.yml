name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      - run: mypy

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      # Fails the build on a known CVE in anything we ship. The starlette
      # floor in requirements.txt exists because of exactly this check.
      - name: Audit installed dependencies
        run: pip-audit --progress-spinner off

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # The committed model is a scikit-learn pickle. Loading it under a
      # different minor version silently risks different predictions, and
      # pyproject turns that warning into an error, so catch a bad
      # dependency bump here rather than in production.
      - name: Verify the model artifact loads cleanly
        run: |
          python - <<'PY'
          import warnings
          warnings.simplefilter("error")
          import joblib
          model = joblib.load("models/cml_elimination_model.joblib")
          print("loaded", type(model).__name__, "features:", len(model.feature_names_in_))
          PY

      - name: Run tests
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  smoke:
    name: API smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      # Exercises the real server, which the TestClient does not: uvicorn
      # startup, the lifespan handler and multipart handling over HTTP.
      - name: Start the API and score the sample dataset
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health | tee /dev/stderr | grep -q '"model_loaded":true'
          curl -fsS -X POST http://127.0.0.1:8000/score-cml-data \
            -F "file=@data/cml_sample_500.csv" \
            | python -c "import json,sys; b=json.load(sys.stdin); assert b['total_results']==500, b; print('scored', b['total_results'])"

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: TARGET=api
          tags: wood-cml-api:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the container becomes healthy and serves predictions
        run: |
          docker run -d --name api -p 8000:8000 wood-cml-api:ci
          for _ in $(seq 1 40); do
            state=$(docker inspect -f '{{.State.Health.Status}}' api)
            [ "$state" = "healthy" ] && break
            [ "$state" = "unhealthy" ] && { docker logs api; exit 1; }
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' api | grep -q healthy
          curl -fsS -X POST http://localhost:8000/score-cml-data \
            -F "file=@data/cml_sample_500.csv" >/dev/null
          # The image must not run as root.
          test "$(docker exec api id -u)" != "0"
          docker rm -f api
